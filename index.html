<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bluebell Books</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Bluebell Books</h2>

        <div>
            <a href="#books">Books</a>
            <a href="#cart">Cart 🛒 <span id="cart-count">0</span></a>
        </div>
    </nav>


    <section class="hero">

        <p>A quiet corner for book lovers</p>

        <h1>Find your next<br>favorite book.</h1>

        <p>
            Explore stories, ideas and adventures.
        </p>

        <a href="#books">Explore Books</a>

    </section>


    <section id="books">

        <p>OUR COLLECTION</p>

        <h2>Popular Books</h2>

        <div id="book-container"></div>

    </section>


    <section id="cart">

        <p>YOUR SELECTION</p>

        <h2>Your Cart</h2>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <h3>
            Total: ₹<span id="cart-total">0</span>
        </h3>

        <button id="clear-cart">
            Clear Cart
        </button>

    </section>


    <footer>
        Bluebell Books · A little place for big stories.
    </footer>


    <script src="script.js"></script>

</body>

</html>
